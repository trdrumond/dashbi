<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/dashbi02.png">
    <title>Trocar senha - DashBI 2.0</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f2f5; }
        .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08); width: 100%; max-width: 360px; }
        .sub { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 0.25rem; font-size: 0.9rem; }
        input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; margin-bottom: 1rem; }
        input:focus { outline: none; border-color: #2563eb; }
        button { width: 100%; padding: 0.75rem; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .erro { background: #fef2f2; color: #b91c1c; padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
        .erro.visivel { display: block; }
        .logo { display: block; max-width: 280px; height: auto; margin: 0 auto 1.25rem; }
        .politica { font-size: 0.8rem; color: #6b7280; margin-top: -0.5rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <img src="../img/dashbi01.png" alt="DashBI" class="logo">
        <p class="sub">Você precisa definir uma nova senha para continuar.</p>
        <div id="erro" class="erro"></div>
        <form id="form">
            <label for="novaSenha">Nova senha</label>
            <input type="password" id="novaSenha" name="novaSenha" required autocomplete="new-password" placeholder="Mín. 8 caracteres, maiúsc., minúsc., número e especial">
            <p class="politica">A senha deve ter 8+ caracteres, uma maiúscula, uma minúscula, um número e um caractere especial (!@#$%&*()-_=+[]{}).</p>
            <label for="confirmar">Confirmar nova senha</label>
            <input type="password" id="confirmar" name="confirmar" required autocomplete="new-password" placeholder="Repita a nova senha">
            <button type="submit">Trocar senha e continuar</button>
        </form>
    </div>
    <script>
        (function() {
            var form = document.getElementById('form');
            var erro = document.getElementById('erro');

            function showErro(msg) {
                erro.textContent = msg;
                erro.classList.add('visivel');
            }

            fetch('api/auth/me', { credentials: 'include' })
                .then(function(r) { return r.json().then(function(d) { return { status: r.status, data: d }; }); })
                .then(function(x) {
                    if (x.status === 401) {
                        window.location.href = 'login.html';
                        return;
                    }
                    if (!x.data.success || !x.data.data) {
                        window.location.href = 'login.html';
                        return;
                    }
                    var user = x.data.data;
                    if (!user.trocar_senha_proximo_acesso) {
                        window.location.href = 'dashboard.php';
                        return;
                    }
                })
                .catch(function() {
                    window.location.href = 'login.html';
                });

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                erro.classList.remove('visivel');
                erro.textContent = '';
                var nova = document.getElementById('novaSenha').value;
                var conf = document.getElementById('confirmar').value;
                if (nova !== conf) {
                    showErro('A senha e a confirmação não conferem.');
                    return;
                }
                if (nova.length < 8) {
                    showErro('A senha deve ter pelo menos 8 caracteres.');
                    return;
                }
                fetch('api/auth/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ senha: nova, confirmar_senha: conf })
                })
                .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
                .then(function(x) {
                    if (x.ok && x.data.success) {
                        window.location.href = 'dashboard.php';
                    } else {
                        showErro(x.data.message || 'Não foi possível alterar a senha. Verifique se atende à política.');
                    }
                })
                .catch(function() {
                    showErro('Erro de conexão. Tente novamente.');
                });
            });
        })();
    </script>
</body>
</html>
